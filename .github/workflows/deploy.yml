# Publie l’app sur GitHub Pages à chaque push sur main.
# L’app construite (dossier dist) est poussée sur la branche gh-pages.
# Réglage à faire une fois : Settings → Pages → Source : « Deploy from a
# branch », Branch : gh-pages, dossier / (root), Save.
name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pousser dist sur gh-pages
        working-directory: dist
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Mise en ligne ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
