<!doctype html>
<html lang="fr" data-theme="sombre">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141415" />
    <meta name="description" content="Le CRM des musiciens indépendants : de la maquette au morceau publié." />
    <title>ctrl.app</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installer l’app sur l’écran d’accueil (iPhone, Android). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ctrl.app" />
    <link rel="preload" href="/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Applique le thème avant l’affichage, pour éviter un flash.
      try {
        if (localStorage.getItem("ctrlapp.theme") === "clair") {
          document.documentElement.dataset.theme = "clair";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9ecef");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
