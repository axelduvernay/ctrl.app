<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ctrl.app</title>
<meta name="description" content="Un whiteboard infini pour ne plus perdre ses idées." />
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- La surface infinie. #world porte la transformation pan/zoom. -->
    <div id="canvas">
      <div id="world">
        <svg id="links" aria-hidden="true"></svg>
        <div id="zones"></div>
        <div id="blocks"></div>
        <svg id="ink" aria-hidden="true"></svg>
      </div>
      <div id="marquee" hidden></div>
    </div>

    <!-- Barre d'outils : création, à gauche. -->
    <div id="toolbar" role="toolbar" aria-label="Outils">
      <button data-tool="select" class="is-active" title="Sélection (V)" aria-label="Sélection">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10.5 19z"/></svg>
      </button>
      <button data-tool="draw" title="Dessiner (D)" aria-label="Dessiner">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
      </button>
      <button data-tool="zone" title="Zone (Z)" aria-label="Zone">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/></svg>
      </button>
      <span class="sep"></span>
      <button data-action="arrange" title="Ranger le tableau" aria-label="Ranger le tableau">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>

    <!-- Menu compte et réglages, en haut à droite. -->
    <div id="topright">
      <button id="menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
      </button>
    </div>

    <!-- Indicateur de zoom, discret, en bas à droite. -->
    <div id="zoombar">
      <button data-zoom="out" aria-label="Dézoomer">−</button>
      <button id="zoom-level" data-zoom="reset" title="Revenir à 100 %">100 %</button>
      <button data-zoom="in" aria-label="Zoomer">+</button>
      <button data-zoom="fit" title="Tout voir" aria-label="Tout voir">
        <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
      </button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
