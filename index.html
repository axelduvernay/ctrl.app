<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ctrl.app</title>
<meta name="description" content="Un whiteboard infini pour ne plus perdre ses idées." />
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141415" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://api.fontshare.com" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div id="app">
    <!-- La surface infinie. #world porte la transformation pan/zoom. -->
    <div id="canvas">
      <div id="world">
        <svg id="links" aria-hidden="true"></svg>
        <div id="zones"></div>
        <div id="blocks"></div>
        <svg id="ink" aria-hidden="true"></svg>
      </div>
      <div id="marquee" hidden></div>
    </div>

    <!-- Barre de création : chaque bouton pose un élément au centre de
         l'écran. Indispensable au doigt, où il n'y a ni clavier ni clic
         droit. Elle se replie en un seul bouton « + ». -->
    <div id="toolbar" role="toolbar" aria-label="Créer">
      <button class="tb" data-create="text" data-tip="Texte" data-key="T" aria-label="Nouveau texte">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M9.5 19h5"/></svg>
      </button>
      <button class="tb" data-create="task" data-tip="Tâche" data-key="K" aria-label="Nouvelle tâche">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M8.5 12.3l2.4 2.4 4.6-5.2"/></svg>
      </button>
      <button class="tb" data-create="image" data-tip="Image" data-key="" aria-label="Ajouter une image">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20 15.5l-4.2-4.2L7.5 19"/></svg>
      </button>
      <button class="tb" data-create="tracks" data-tip="Tracklist" data-key="" aria-label="Nouvelle tracklist">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      </button>
      <button class="tb" data-create="zone" data-tip="Zone" data-key="M" aria-label="Nouvelle zone">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="4.5" stroke-dasharray="3.2 2.6"/></svg>
      </button>
      <button class="tb" data-tool="draw" data-tip="Crayon" data-key="B" aria-label="Crayon">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 6l3 3"/></svg>
      </button>
      <span class="sep tb"></span>
      <button class="tb" data-action="arrange" data-tip="Aligner" data-key="R" aria-label="Aligner">
        <svg viewBox="0 0 24 24"><path d="M4 4v16"/><rect x="7" y="6" width="10" height="4" rx="1.2"/><rect x="7" y="14" width="13" height="4" rx="1.2"/></svg>
      </button>
      <button class="toggle" data-action="collapse" data-tip="Réduire" data-key="" aria-label="Réduire la barre" aria-expanded="true">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Menu compte et réglages, en haut à droite. -->
    <div id="topright">
      <button id="menu-btn" aria-haspopup="menu" aria-expanded="false" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>
      </button>
    </div>

    <!-- Indicateur de zoom, discret, en bas à droite. -->
    <div id="zoombar">
      <button data-zoom="out" data-tip="Dézoomer" data-key="⌘ −" aria-label="Dézoomer">−</button>
      <button id="zoom-level" data-zoom="reset" title="Revenir à 100 % (⌘0)" aria-label="Revenir à 100 %">100 %</button>
      <button data-zoom="in" data-tip="Zoomer" data-key="⌘ +" aria-label="Zoomer">+</button>
      <button data-zoom="fit" data-tip="Tout voir" data-key="⇧ 1" aria-label="Tout voir">
        <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg>
      </button>
    </div>

    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
